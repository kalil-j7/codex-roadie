name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify portable core and repository hygiene
        run: |
          cargo +1.90.0 test -p roadie-core --locked
          cargo +1.90.0 clippy -p roadie-core --all-targets --locked -- -D warnings
          cargo +1.90.0 fmt --all -- --check
          node --check ui/app.js
          npm audit
          ./scripts/check-public-readiness.sh

  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy

      - name: Verify the macOS workspace
        run: |
          cargo +1.90.0 test --workspace --locked
          cargo +1.90.0 clippy --workspace --all-targets --locked -- -D warnings
